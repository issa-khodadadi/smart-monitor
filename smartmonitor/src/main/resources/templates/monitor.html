<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SmartMonitor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
          --bg: #0a0d12;
          --surface: #12161e;
          --surface-raised: #171c26;
          --border: #1f2530;
          --border-strong: #2a3140;
          --text: #e4e7ec;
          --text-muted: #6b7280;
          --text-dim: #4b5563;
          --cpu: #3fb1ce;
          --db: #e0a640;
          --err: #e0596a;
          --ok: #4fc98a;
          --warn: #e08c40;
          --radius: 6px;
          --mono: 'JetBrains Mono', ui-monospace, monospace;
        }
        * { box-sizing: border-box; }
        body {
          font-family: 'Inter', -apple-system, sans-serif;
          background: var(--bg);
          color: var(--text);
          margin: 0;
          padding: 0;
          font-size: 14px;
          -webkit-font-smoothing: antialiased;
        }
        .shell { max-width: 1280px; margin: 0 auto; padding: 28px 32px 64px; }

        .topbar { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
        .topbar h1 { font-size: 15px; font-weight: 600; letter-spacing: 0.02em; margin: 0; color: var(--text); }
        .topbar .brand-dot { display:inline-block; width:6px; height:6px; border-radius:50%; background: var(--ok); margin-right:8px; box-shadow: 0 0 0 3px rgba(79,201,138,0.15); }
        .topbar .sub { color: var(--text-muted); font-size: 12px; font-family: var(--mono); }

        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 12px; }
        .stat { background: var(--surface); padding: 14px 16px; cursor: default; transition: background 0.15s; }
        .stat.clickable { cursor: pointer; }
        .stat.clickable:hover { background: var(--surface-raised); }
        .stat .stat-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin-bottom: 6px; }
        .stat .stat-value { font-family: var(--mono); font-size: 19px; font-weight: 600; color: var(--text); line-height: 1.2; }
        .stat .stat-value.cpu { color: var(--cpu); }
        .stat .stat-value.db { color: var(--db); }
        .stat .stat-value.err { color: var(--err); }

        .bottleneck-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 28px; }
        @media (max-width: 780px) { .bottleneck-grid { grid-template-columns: 1fr; } }
        .bn-card { background: var(--surface); padding: 14px 16px; }
        .bn-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin-bottom: 8px; }
        .bn-name { font-family: var(--mono); font-size: 13px; font-weight: 500; color: var(--text); line-height: 1.45; word-break: break-word; }
        .bn-name.cpu { color: var(--cpu); }
        .bn-name.db { color: var(--db); }
        .bn-name.err { color: var(--err); }
        .bn-time { font-family: var(--mono); font-size: 11px; color: var(--text-dim); margin-top: 5px; }
        .bn-empty { font-family: var(--mono); font-size: 13px; color: var(--text-dim); }

        .section { margin-bottom: 28px; }
        .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .section-head h2 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin: 0; }
        .section-head .hint { font-size: 11.5px; color: var(--text-dim); }

        .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
        .panel-pad { padding: 16px; }

        .charts-row { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
        @media (max-width: 860px) { .charts-row { grid-template-columns: 1fr; } }

        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); font-weight: 500; padding: 10px 14px; border-bottom: 1px solid var(--border-strong); background: var(--surface-raised); }
        td { padding: 9px 14px; border-bottom: 1px solid var(--border); font-size: 13px; }
        td.mono, th.num { font-family: var(--mono); }
        th.num { text-align: right; }
        td.num { text-align: right; font-family: var(--mono); color: var(--text); }
        tr.row-clickable { cursor: pointer; }
        tr.row-clickable:hover td { background: var(--surface-raised); }
        tr.row-selected td { background: #16202a; }
        tbody tr:last-child td { border-bottom: none; }

        .name-cell { color: var(--text); }
        .name-cell .method { color: var(--text-muted); }

        .t-hot { color: var(--err) !important; font-weight: 700; }
        .t-warn { color: var(--warn) !important; font-weight: 600; }

        .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 500; padding: 2px 7px; border-radius: 3px; letter-spacing: 0.02em; }
        .pill .dot { width: 5px; height: 5px; border-radius: 50%; }
        .pill-service { color: var(--ok); background: rgba(79,201,138,0.1); }
        .pill-service .dot { background: var(--ok); }
        .pill-repository { color: var(--db); background: rgba(224,166,64,0.1); }
        .pill-repository .dot { background: var(--db); }
        .pill-controller { color: var(--cpu); background: rgba(63,177,206,0.1); }
        .pill-controller .dot { background: var(--cpu); }
        .pill-other { color: var(--text-muted); background: rgba(107,114,128,0.1); }
        .pill-other .dot { background: var(--text-muted); }

        .type-tag { font-family: var(--mono); font-size: 11px; font-weight: 500; }
        .type-tag.database { color: var(--db); }
        .type-tag.cpu { color: var(--cpu); }
        .type-tag.unknown { color: var(--text-muted); }

        #methodsSection { display: none; margin-top: 16px; }


        .ai-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--border); }
        .ai-head-left { display: flex; align-items: center; gap: 8px; }
        .ai-head-left h2 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin: 0; }
        .btn { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500; border: 1px solid var(--border-strong); background: var(--surface-raised); color: var(--text); padding: 6px 12px; border-radius: 5px; cursor: pointer; transition: border-color 0.15s; }
        .btn:hover { border-color: var(--cpu); }
        .btn:disabled { opacity: 0.5; cursor: default; }
        .btn-primary { background: var(--cpu); border-color: var(--cpu); color: #06222c; font-weight: 600; }
        .btn-primary:hover { border-color: var(--cpu); opacity: 0.9; }
        .timestamp { font-family: var(--mono); font-size: 11px; color: var(--text-dim); margin-right: 10px; }

        .finding { border-left: 2px solid var(--border-strong); padding: 10px 14px; margin: 10px 16px; border-radius: 0 4px 4px 0; background: var(--surface-raised); }
        .finding.sev-high { border-left-color: var(--err); }
        .finding.sev-medium { border-left-color: var(--db); }
        .finding.sev-low { border-left-color: var(--ok); }
        .finding-top { display: flex; justify-content: space-between; align-items: baseline; }
        .finding-endpoint { font-family: var(--mono); font-size: 12.5px; color: var(--text); }
        .finding-meta { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); }
        .finding-issue { font-size: 12.5px; color: var(--text-muted); margin-top: 5px; }
        .finding-suggestion { font-size: 12.5px; color: var(--ok); margin-top: 5px; }

        .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 1000; align-items: center; justify-content: center; }
        .modal { background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius); width: 92%; max-width: 620px; max-height: 72vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
        .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--border); }
        .modal-head h3 { margin: 0; font-size: 13px; font-weight: 600; color: var(--err); }
        .modal-body { overflow-y: auto; padding: 12px 16px; }
        .err-item { border-left: 2px solid var(--err); background: var(--surface-raised); padding: 8px 12px; margin-bottom: 8px; border-radius: 0 4px 4px 0; }
        .err-item-top { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; color: var(--text-muted); }
        .err-item-type { color: var(--err); font-size: 12.5px; font-weight: 600; margin-top: 4px; font-family: var(--mono); }
        .err-item-method { color: var(--text); font-size: 12px; margin-top: 2px; }
        .err-item-msg { color: var(--text-muted); font-size: 12px; margin-top: 2px; }
        .empty-note { color: var(--text-dim); font-size: 12.5px; text-align: center; padding: 24px 0; }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
    </style>
</head>
<body>
<div class="shell">

    <div class="topbar">
        <h1><span class="brand-dot"></span>SmartMonitor</h1>
        <span class="sub" id="liveClock">—</span>
    </div>

    <div class="stat-grid" id="panels"></div>
    <div class="bottleneck-grid" id="bottleneckPanels"></div>

    <div class="section">
        <div class="section-head">
            <h2>Load composition</h2>
            <span class="hint">CPU vs. database time, per second</span>
        </div>
        <div class="charts-row">
            <div class="panel panel-pad">
                <canvas id="heartbeatChart" height="70"></canvas>
            </div>
            <div class="panel panel-pad">
                <canvas id="rankChart" height="70"></canvas>
            </div>
        </div>
    </div>

    <div class="section" id="aiSectionWrap" style="display:none;">
        <div class="panel" id="aiSection">
            <div class="ai-head">
                <div class="ai-head-left"><h2>AI Analysis</h2></div>
                <div>
                    <span class="timestamp" id="aiTimestamp"></span>
                    <button class="btn" id="aiRefreshBtn" onclick="runAiAnalysis(true)">Refresh</button>
                    <button class="btn btn-primary" id="aiAnalyzeBtn" onclick="runAiAnalysis(false)">Analyze</button>
                </div>
            </div>
            <div id="aiResults"></div>
        </div>
    </div>

    <div class="section">
        <div class="section-head">
            <h2>Endpoints</h2>
            <span class="hint">Top 10 by total time — click a row to inspect</span>
        </div>
        <div class="panel">
            <table>
                <thead>
                <tr>
                    <th>Endpoint</th><th class="num">Calls</th><th class="num">Errors</th><th class="num">Avg&nbsp;ms</th><th class="num">Max&nbsp;ms</th><th class="num">Total&nbsp;ms</th><th class="num">DB&nbsp;ms</th><th class="num">Mem&nbsp;KB</th>
                </tr>
                </thead>
                <tbody id="endpointsBody"></tbody>
            </table>
        </div>
    </div>

    <div class="section" id="methodsSection">
        <div class="section-head">
            <h2 id="methodsTitle">Methods</h2>
        </div>
        <div class="panel">
            <table>
                <thead>
                <tr>
                    <th>Method</th><th>Layer</th><th class="num">Calls</th><th class="num">Errors</th><th class="num">Self&nbsp;ms</th><th class="num">Total&nbsp;ms</th><th class="num">DB&nbsp;ms</th><th class="num">Mem&nbsp;KB</th><th class="num">Type</th>
                </tr>
                </thead>
                <tbody id="methodsBody"></tbody>
            </table>
        </div>
    </div>

</div>

<div class="modal-backdrop" id="errorsModal" onclick="closeErrorsModalOnBackdrop(event)">
    <div class="modal">
        <div class="modal-head">
            <h3>Recent errors</h3>
            <button class="btn" onclick="toggleErrorsPanel()">Close</button>
        </div>
        <div class="modal-body" id="errorsList"></div>
    </div>
</div>

<script>
    const COLOR = { cpu: '#3fb1ce', db: '#e0a640', err: '#e0596a', ok: '#4fc98a', muted: '#6b7280', grid: '#1f2530' };

    const TIME_HOT_MS = 5000;
    const TIME_WARN_MS = 500;

    let rankChart, heartbeatChart;
    let selectedEndpoint = null;
    let errorsVisible = false;

    function shortLabel(key) { return key ? key.replace('#', '.') : '-'; }

    function timeClass(ms) {
      if (ms >= TIME_HOT_MS) return 't-hot';
      if (ms >= TIME_WARN_MS) return 't-warn';
      return '';
    }

    function layerPill(layer) {
      const cls = { SERVICE: 'pill-service', REPOSITORY: 'pill-repository', CONTROLLER: 'pill-controller' }[layer] || 'pill-other';
      return `<span class="pill ${cls}"><span class="dot"></span>${layer}</span>`;
    }

    function updateClock() {
      document.getElementById('liveClock').textContent = new Date().toLocaleTimeString();
    }
    setInterval(updateClock, 1000);
    updateClock();

    function bottleneckCard(label, b, colorClass) {
      if (!b) {
        return `<div class="bn-card"><div class="bn-label">${label}</div><div class="bn-empty">No data</div></div>`;
      }
      return `
        <div class="bn-card">
          <div class="bn-label">${label}</div>
          <div class="bn-name ${colorClass}">${shortLabel(b.key)}</div>
          <div class="bn-time">${b.totalTimeMs} ms total · ${b.callCount} calls</div>
        </div>
      `;
    }

    function renderOrUpdateBar(labels, values) {
      const ctx = document.getElementById('rankChart');
      if (rankChart) {
        rankChart.data.labels = labels;
        rankChart.data.datasets[0].data = values;
        rankChart.update('none');
        return;
      }
      rankChart = new Chart(ctx, {
        type: 'bar',
        data: { labels, datasets: [{ data: values, backgroundColor: COLOR.cpu, borderRadius: 3, barThickness: 14 }] },
        options: {
          indexAxis: 'y',
          plugins: { legend: { display: false }, title: { display: true, text: 'Top 5 endpoints (ms)', color: COLOR.muted, font: { size: 11, weight: '500' }, align: 'start', padding: { bottom: 10 } } },
          scales: {
            x: { grid: { color: COLOR.grid }, ticks: { color: COLOR.muted, font: { family: "'JetBrains Mono'", size: 10.5 } } },
            y: { grid: { display: false }, ticks: { color: '#e4e7ec', font: { size: 11 } } }
          }
        }
      });
    }

    function initHeartbeatChart() {
      const ctx = document.getElementById('heartbeatChart');
      heartbeatChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: [],
          datasets: [
            { label: 'CPU ms/s', data: [], borderColor: COLOR.cpu, backgroundColor: 'rgba(63,177,206,0.12)', borderWidth: 1.5, pointRadius: 0, tension: 0.25, fill: true, stack: 'load' },
            { label: 'DB ms/s', data: [], borderColor: COLOR.db, backgroundColor: 'rgba(224,166,64,0.12)', borderWidth: 1.5, pointRadius: 0, tension: 0.25, fill: true, stack: 'load' }
          ]
        },
        options: {
          animation: { duration: 250 },
          interaction: { mode: 'index', intersect: false },
          plugins: {
            title: { display: true, text: 'CPU vs. DB (ms/s)', color: COLOR.muted, font: { size: 11, weight: '500' }, align: 'start', padding: { bottom: 10 } },
            legend: { position: 'bottom', labels: { color: '#9aa3b2', font: { size: 10.5 }, boxWidth: 10, boxHeight: 10 } }
          },
          scales: {
            x: { display: false },
            y: { stacked: true, grid: { color: COLOR.grid }, ticks: { color: COLOR.muted, font: { family: "'JetBrains Mono'", size: 10 } } }
          }
        }
      });
    }

    async function refreshHeartbeat() {
      const res = await fetch('/monitor/api/history');
      const points = await res.json();
      heartbeatChart.data.labels = points.map(p => new Date(p.time).toLocaleTimeString());
      heartbeatChart.data.datasets[0].data = points.map(p => p.cpuTimeMsPerSec);
      heartbeatChart.data.datasets[1].data = points.map(p => p.dbTimeMsPerSec);
      heartbeatChart.update('none');
    }

    async function loadMethods(endpointKey) {
      selectedEndpoint = endpointKey;
      const res = await fetch('/monitor/api/endpoint-methods?key=' + encodeURIComponent(endpointKey));
      const methods = await res.json();

      document.getElementById('methodsSection').style.display = 'block';
      document.getElementById('methodsTitle').innerHTML = 'Methods inside <span style="font-family:var(--mono); color:var(--text); text-transform:none; letter-spacing:0;">' + shortLabel(endpointKey) + '</span>';

      const tbody = document.getElementById('methodsBody');
      tbody.innerHTML = '';

      methods.forEach(m => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="name-cell"><span class="method">${m.className}.</span>${m.methodName}</td>
          <td>${layerPill(m.layer)}</td>
          <td class="num">${m.callCount}</td>
          <td class="num">${m.errorCount}</td>
          <td class="num ${timeClass(m.selfTimeMs)}">${m.selfTimeMs}</td>
          <td class="num ${timeClass(m.totalTimeMs)}">${m.totalTimeMs}</td>
          <td class="num ${timeClass(m.dbTimeMs)}">${m.dbTimeMs}</td>
          <td class="num">${m.memoryKb}</td>
          <td class="num"><span class="type-tag ${m.bottleneckType.toLowerCase()}">${m.bottleneckType}</span></td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function refresh() {
      const [overviewRes, endpointsRes] = await Promise.all([
        fetch('/monitor/api/overview'),
        fetch('/monitor/api/endpoints')
      ]);
      const overview = await overviewRes.json();
      const endpoints = await endpointsRes.json();

      document.getElementById('panels').innerHTML = `
        <div class="stat"><div class="stat-label">Total calls</div><div class="stat-value">${overview.totalCalls}</div></div>
        <div class="stat clickable" onclick="toggleErrorsPanel()"><div class="stat-label">Errors</div><div class="stat-value err">${overview.totalErrors}</div></div>
        <div class="stat"><div class="stat-label">DB time</div><div class="stat-value db">${overview.dbTimeMs}<span style="font-size:11px;color:var(--text-dim);"> ms</span></div></div>
        <div class="stat"><div class="stat-label">CPU time</div><div class="stat-value cpu">${overview.cpuTimeMs}<span style="font-size:11px;color:var(--text-dim);"> ms</span></div></div>
      `;

      document.getElementById('bottleneckPanels').innerHTML =
        bottleneckCard('Top CPU bottleneck', overview.topCpuBottleneck, 'cpu') +
        bottleneckCard('Top IO bottleneck', overview.topDatabaseBottleneck, 'db') +
        bottleneckCard('Top other bottleneck', overview.topUnknownBottleneck, 'err');

      document.getElementById('aiSectionWrap').style.display = overview.aiEnabled ? 'block' : 'none';

      renderOrUpdateBar(
        endpoints.slice(0, 5).map(e => shortLabel(e.key)),
        endpoints.slice(0, 5).map(e => e.totalTimeMs)
      );

      const tbody = document.getElementById('endpointsBody');
      tbody.innerHTML = '';
      endpoints.forEach(ep => {
        const tr = document.createElement('tr');
        tr.className = 'row-clickable' + (ep.key === selectedEndpoint ? ' row-selected' : '');
        tr.innerHTML = `
          <td class="name-cell mono">${shortLabel(ep.key)}</td>
          <td class="num">${ep.callCount}</td>
          <td class="num">${ep.errorCount}</td>
          <td class="num ${timeClass(ep.avgTimeMs)}">${ep.avgTimeMs}</td>
          <td class="num ${timeClass(ep.maxTimeMs)}">${ep.maxTimeMs}</td>
          <td class="num ${timeClass(ep.totalTimeMs)}">${ep.totalTimeMs}</td>
          <td class="num ${timeClass(ep.dbTimeMs)}">${ep.dbTimeMs}</td>
          <td class="num">${ep.memoryKb}</td>
        `;
        tr.onclick = () => loadMethods(ep.key);
        tbody.appendChild(tr);
      });

      if (selectedEndpoint) loadMethods(selectedEndpoint);
      refreshHeartbeat();
      if (errorsVisible) loadErrors();
    }

    function closeErrorsModalOnBackdrop(event) {
      if (event.target.id === 'errorsModal') toggleErrorsPanel();
    }

    async function toggleErrorsPanel() {
      errorsVisible = !errorsVisible;
      document.getElementById('errorsModal').style.display = errorsVisible ? 'flex' : 'none';
      if (errorsVisible) await loadErrors();
    }

    async function loadErrors() {
      const res = await fetch('/monitor/api/errors');
      const errors = await res.json();
      const container = document.getElementById('errorsList');

      if (errors.length === 0) {
        container.innerHTML = '<div class="empty-note">No errors recorded in the current window.</div>';
        return;
      }

      container.innerHTML = errors.map(e => `
        <div class="err-item">
          <div class="err-item-top"><span>${e.endpoint}</span><span>${new Date(e.time).toLocaleTimeString()}</span></div>
          <div class="err-item-type">${e.exceptionType}</div>
          <div class="err-item-method">${e.method}</div>
          <div class="err-item-msg">${e.message || '(no message)'}</div>
        </div>
      `).join('');
    }

    function severityClass(sev) {
      return { HIGH: 'sev-high', MEDIUM: 'sev-medium', LOW: 'sev-low' }[sev] || 'sev-low';
    }

    function renderAiResults(rawJson) {
      const container = document.getElementById('aiResults');
      let items;
      try { items = JSON.parse(rawJson); }
      catch (e) {
        container.innerHTML = `<pre style="white-space:pre-wrap; color:var(--text-muted); font-size:12px; padding:14px 16px; margin:0;">${rawJson}</pre>`;
        return;
      }
      container.innerHTML = items.map(item => `
        <div class="finding ${severityClass(item.severity)}">
          <div class="finding-top">
            <span class="finding-endpoint">${item.endpoint || ''}</span>
            <span class="finding-meta">${item.severity || ''} · ${item.cause || ''}</span>
          </div>
          <div class="finding-issue">${item.issue || ''}</div>
          <div class="finding-suggestion">${item.suggestion || ''}</div>
        </div>
      `).join('');
    }

    async function runAiAnalysis(forceRefresh) {
      const btn = document.getElementById('aiAnalyzeBtn');
      const refreshBtn = document.getElementById('aiRefreshBtn');
      btn.disabled = true; refreshBtn.disabled = true;
      document.getElementById('aiResults').innerHTML = '<div class="empty-note">Analyzing…</div>';

      try {
        const res = await fetch('/monitor/api/ai-analysis?refresh=' + forceRefresh, { method: 'POST' });
        const data = await res.json();
        if (!res.ok) {
          document.getElementById('aiResults').innerHTML = `<div class="empty-note" style="color:var(--err);">${data.error}</div>`;
          return;
        }
        renderAiResults(data.rawJson);
        document.getElementById('aiTimestamp').textContent = new Date(data.generatedAtMillis).toLocaleTimeString();
      } catch (e) {
        document.getElementById('aiResults').innerHTML = `<div class="empty-note" style="color:var(--err);">Request failed: ${e}</div>`;
      } finally {
        btn.disabled = false; refreshBtn.disabled = false;
      }
    }

    initHeartbeatChart();
    refresh();
    setInterval(refresh, 3000);
</script>
</body>
</html>
